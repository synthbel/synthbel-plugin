<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>SynthBel result</title>
<style>
:root{color-scheme:light;--ink:#20252a;--muted:#667080;--line:#dedbd4;--accent:#315d88;--paper:#fff;--wash:#faf9f6;--judged:#9a5a25}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:1120px;margin:36px auto;padding:30px;background:var(--paper);border:1px solid var(--line);border-radius:18px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:750}h1{font-size:clamp(24px,4vw,36px);line-height:1.2;max-width:850px}h2{font-size:19px}p{margin:.7em 0}.meta,.note{color:var(--muted);font-size:14px}.pill{display:inline-block;padding:3px 10px;border-radius:18px;background:#e9f1e9;font-size:13px;margin:0 8px 7px 0}.notice{background:#fff4df;border-left:4px solid #b88124;padding:12px 16px;border-radius:4px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th:first-child,td:first-child{text-align:left;min-width:150px}th{font-size:13px;color:var(--muted)}.scroll{overflow:auto}.bar-row{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 65px;gap:16px;align-items:center;margin:18px 0}.track{height:18px;border-radius:4px;background:#edf0e9;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:4px}.value{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.scenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:20px 0}.scenario{border:1px solid var(--line);border-radius:10px;padding:14px}.scenario h2{font-size:15px;margin-top:0}.scenario td:first-child,.scenario th:first-child{min-width:0}.legend{display:flex;gap:18px;font-size:13px;color:var(--muted)}.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;background:var(--accent)}.judged{background:var(--judged)}.pair{display:grid;gap:4px}.pair .track{height:12px}.pair .track:last-child .fill{background:var(--judged)}details{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}summary{cursor:pointer;font-weight:650}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.55 ui-monospace,monospace;background:var(--wash);padding:16px;border-radius:8px}button,a.button{background:white;border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}button:hover{border-color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.source{margin:14px 0}.source a{color:var(--accent)}footer{margin-top:24px;color:var(--muted);font-size:12px}#copy-status{font-size:13px;color:var(--muted)}@media(max-width:650px){main{margin:12px;padding:20px}header{align-items:flex-start;flex-direction:column}.bar-row{grid-template-columns:1.3fr 2fr 50px;gap:9px}td,th{padding:8px 6px}}@media print{body{background:white}main{border:0;margin:0;max-width:none}.actions{display:none}details{break-inside:avoid}}

.chart-legend{display:flex;gap:10px 18px;flex-wrap:wrap;margin:18px 0;font-size:13px}.chart-key{display:inline-block;width:18px;height:11px;margin-right:6px;border:1px solid #d6d2ca}.stack-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center;margin:22px 0}.stack-label{font-size:14px;line-height:1.35}.stack-plot{height:38px;position:relative}.segment{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid white;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.segment.hatched{background-image:repeating-linear-gradient(135deg,transparent 0,transparent 13px,#ffffffb8 13px,#ffffffb8 15px)}.zero-line{position:absolute;top:-7px;bottom:-7px;border-left:1px solid #343b43;z-index:2}.group-total{position:absolute;top:8px;font-size:13px;font-weight:700}.group-total.negative{transform:translateX(-100%);color:#aa3e2b}.group-total.positive{color:#20527d}.tabbar{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:22px;margin-top:24px}.tabbar button{font-size:14px}.tabbar button[aria-selected=true]{background:var(--accent);color:white;border-color:var(--accent)}.tab-panel{padding:18px 0}.tab-panel[hidden]{display:none}.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.evidence-card{border:1px solid var(--line);padding:16px;border-radius:8px;margin:15px 0}.evidence-card h3{font-size:16px;line-height:1.45;margin:0 0 10px}.evidence-meta{background:#eef2f8;padding:7px 9px;border-radius:5px;font-size:13px}.prediction-note{background:#faf9f6;border-left:3px solid #315d88;padding:12px 15px;margin:16px 0}.prediction-note h3{margin:0 0 10px;font-size:16px}.prediction-note h4{margin:12px 0 4px;font-size:14px}.prediction-note p{font-size:15px}.qualification{font-size:13px;color:var(--muted)}@media(max-width:720px){.stack-row{grid-template-columns:1fr;gap:8px}.method-grid{grid-template-columns:1fr}.stack-label{font-weight:600}.segment{font-size:12px}.group-total{font-size:12px}.tabbar button{padding:8px 10px}}
</style>
<main>
<header><div class="brand">SynthBel · Research estimate</div><div class="actions"><button id="copy">Copy table</button><button id="download">Download JSON</button></div></header>
<h1 id="question"></h1><p class="meta" id="audience"></p><div id="badges"></div>
<p id="summary"></p><div id="result"></div><p id="copy-status" role="status" aria-live="polite"></p>
<div class="tabbar" id="views" role="tablist" aria-label="Result details"></div>
<section id="method-panel" class="tab-panel" role="tabpanel"><div class="method-grid"><div><h2>Questions and measurements from the corpus</h2><div id="used-evidence"></div></div><div><h2>How the estimate was made</h2><div id="explanation"></div><div id="per-call"></div></div></div></section>
<section id="evidence-panel" class="tab-panel" role="tabpanel" hidden><div id="sources"></div><details><summary>Complete digest received by the model</summary><pre id="digest"></pre></details></section>
<section id="repeat-details" class="tab-panel" role="tabpanel" hidden><div id="repeats"></div></section>
<section id="group-panel" class="tab-panel" role="tabpanel" hidden><div id="group-results"></div></section>
<details><summary>Parameters and provenance</summary><pre id="parameters"></pre></details>
<footer>Synthetic estimates and fear scenarios are model judgments. Scenario ranges and repeat variation are not confidence intervals.</footer>
</main>
<script type="application/json" id="result-data">__SYNTHBEL_RESULT__</script>
<script>
"use strict";
const d=JSON.parse(document.getElementById("result-data").textContent);
const el=id=>document.getElementById(id), node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;};
const fmt=v=>Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
const percent=v=>fmt(v)+"%";
const message=text=>el("result").append(node("p",text,"notice"));
let copyRows=[];
el("question").textContent=d.target.wording;
el("audience").textContent=d.target.population+" · "+d.target.date;
el("summary").textContent=d.summary||"";
for(const text of [d.command==="question"?({digest:"Prediction from v0.22 digest",search:"Model-led search",neurodigest:"Prediction from neurodigest"}[d.mode]):"Disclosure fear assessment",d.model.name,d.command==="question"?d.repeats+" prediction(s)":null])if(text)el("badges").append(node("span",text,"pill"));
const makeTable=(head,rows,parent)=>{const wrap=node("div",undefined,"scroll"),table=node("table"),thead=node("thead"),tr=node("tr");for(const text of head)tr.append(node("th",text));thead.append(tr);table.append(thead);const body=node("tbody");for(const row of rows){const tr=node("tr");for(const text of row)tr.append(node("td",text));body.append(tr);}table.append(body);wrap.append(table);parent.append(wrap);return [head,...rows];};
const palette=["#315d88","#ab583f","#558879","#82618f","#ad8642","#787f87"];
const colors=options=>Object.fromEntries(options.map((o,i)=>[o.code,o.group==="negative"?(o.strength==="weak"?"#e5a18f":"#aa3e2b"):o.group==="positive"?(o.strength==="weak"?"#81a9ca":"#20527d"):o.group==="dk"?"#e6e2da":o.group==="neutral"?"#c9c6bf":o.group==="refusal"?"#94999f":palette[i%palette.length]]));
const stacked=(rows,parent)=>{
  const options=d.target.options,cols=colors(options),diverging=options.every(o=>["negative","positive","dk","refusal"].includes(o.group))&&options.some(o=>o.group==="negative")&&options.some(o=>o.group==="positive");
  let ordered=options;
  if(diverging)ordered=[...options.filter(o=>o.group==="negative").sort((a,b)=>(a.strength==="weak")-(b.strength==="weak")),...options.filter(o=>o.group==="positive").sort((a,b)=>(a.strength==="strong")-(b.strength==="strong")),...options.filter(o=>!["negative","positive"].includes(o.group))];
  const legend=node("div",undefined,"chart-legend");for(const o of ordered){const label=node("span");const swatch=node("span",undefined,"chart-key");swatch.style.background=cols[o.code];label.append(swatch,document.createTextNode(o.label));legend.append(label);}parent.append(legend);
  const negative=r=>options.filter(o=>o.group==="negative").reduce((n,o)=>n+r.shares[o.code],0);
  const valid=rows.filter(r=>r.shares),left=diverging?-Math.max(0,...valid.map(negative))-8:0,right=diverging?Math.max(0,...valid.map(r=>100-negative(r)))+8:100,span=right-left;
  for(const row of rows){const entry=node("div",undefined,"stack-row"),label=node("div",row.label,"stack-label"),plot=node("div",undefined,"stack-plot");entry.append(label,plot);if(!row.shares){plot.append(node("span",row.status||"No estimate","note"));parent.append(entry);continue;}
    let x=diverging?-negative(row):0;for(const o of ordered){const value=row.shares[o.code],segment=node("div",value>=6?fmt(value):"","segment"+(row.hatched?" hatched":""));segment.style.left=((x-left)/span*100)+"%";segment.style.width=(value/span*100)+"%";segment.style.backgroundColor=cols[o.code];const rgb=cols[o.code].slice(1).match(/../g).map(c=>parseInt(c,16)/255);segment.style.color=(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])<.45?"white":"#20252a";segment.title=o.label+": "+percent(value);segment.setAttribute("aria-label",segment.title);plot.append(segment);x+=value;}
    if(diverging){const zero=node("span",undefined,"zero-line");zero.style.left=(-left/span*100)+"%";plot.append(zero);const no=node("span",fmt(negative(row)),"group-total negative"),yes=node("span",fmt(options.filter(o=>o.group==="positive").reduce((n,o)=>n+row.shares[o.code],0)),"group-total positive");no.style.left=((-negative(row)-left-2)/span*100)+"%";yes.style.left=((x-left+2)/span*100)+"%";plot.append(no,yes);}parent.append(entry);
  }
};
const addView=(label,id)=>{const button=node("button",label);button.id="tab-"+id;button.setAttribute("role","tab");button.setAttribute("aria-controls",id);button.setAttribute("aria-selected",String(id==="method-panel"));el(id).setAttribute("aria-labelledby",button.id);button.addEventListener("click",()=>{for(const tab of el("views").children){const active=tab===button;tab.setAttribute("aria-selected",String(active));el(tab.getAttribute("aria-controls")).hidden=!active;}});el("views").append(button);};
const evidenceCards=(records,parent)=>{if(!records.length){parent.append(node("p","No structured corpus records were supplied. Inspect the exact digest and source ledger; source attribution may be incomplete.","note"));return;}for(const r of records){const card=node("article",undefined,"evidence-card");card.append(node("h3",r.wording),node("p",[r.source,r.date,"sample n="+(r.sample_n??"not reported"),r.item_n!==undefined?"item n="+r.item_n:null,r.population,r.mode,r.page!==undefined?"page "+r.page:null].filter(Boolean).join(" · "),"evidence-meta"));card.append(node("p",r.id+" · "+(r.attribution==="explicit"?"Explicitly cited by the model":"Supplied in the digest; use not individually confirmed"),"qualification"));if(r.shares){const values=(r.options||[]).map(o=>o.label+": "+(r.shares[o.code]===undefined?"not reported":percent(r.shares[o.code])));card.append(node("p",values.join("; ")));}if(r.distribution_text)card.append(node("p",r.distribution_text));if(r.denominator)card.append(node("p","Base: "+r.denominator,"note"));if(r.use)card.append(node("p",r.use));if(r.limitations)card.append(node("p",r.limitations,"qualification"));parent.append(card);}};
const predictionNotes=(result,parent)=>{for(const [i,r] of (result.runs||[]).entries()){const block=node("article",undefined,"prediction-note");block.append(node("h3","Call "+(i+1)+": "+(r.status==="ok"?result.target.options.map(o=>o.label+" "+percent(r.shares[o.code])).join("; "):r.status)));if(r.evidence_note)block.append(node("h4","Model on its evidence"),node("p",r.evidence_note));block.append(node("h4","How it estimated"),node("p",r.reasoning||"No explanation supplied."));if(r.used_evidence_ids?.length)block.append(node("p","Cited records: "+r.used_evidence_ids.join(", "),"note"));parent.append(block);}};
addView(d.command==="fear"?"How fear was assessed":"How the model estimated","method-panel");addView("Sources and full digest","evidence-panel");
evidenceCards(d.used_evidence||[],el("used-evidence"));

let explanation=d.reasoning||"";
if(d.command==="question"){
  const strength={history:"Evidence: earlier measurements of the same question",related:"Evidence: related questions only",insufficient:"Evidence: insufficient usable records"};
  el("result").append(node("p",strength[d.evidence_strength]||"Evidence basis not supplied","note"));
  if(d.shares){const chartRows=[];for(const c of d.comparisons||[])if(c.kind==="observed")chartRows.push({label:c.label+" · "+c.target.date,shares:c.shares});chartRows.push({label:d.model.name+" · "+d.mode,shares:d.shares});for(const c of d.comparisons||[])if(c.kind==="prediction")chartRows.push({label:c.label+" · "+c.result.target.date,shares:c.result.shares,hatched:true,status:c.result.status});stacked(chartRows,el("result"));for(const c of d.comparisons||[])if(c.comparability_note)el("result").append(node("p",c.label+": "+c.comparability_note,"qualification"));const rows=d.target.options.map(o=>[o.label,percent(d.shares[o.code]),...(d.repeats===3?[fmt(d.spread[o.code].min)+"–"+fmt(d.spread[o.code].max)+"%"]:[])]);copyRows=makeTable(["Answer",d.repeats===3?"Mean prediction":"Prediction",...(d.repeats===3?["Range across predictions"]:[])],rows,el("result"));}
  else message(d.status==="unsupported"?d.reasoning:"No complete estimate. Failed or refused predictions are retained below; no partial mean was calculated.");
  if(d.repeats===3||d.status==="incomplete")addView("Individual predictions","repeat-details");
  predictionNotes(d,el("per-call"));
  for(const [i,r] of (d.runs||[]).entries()){el("repeats").append(node("h2","Prediction "+(i+1)+" · "+r.status));if(r.status==="ok")makeTable(["Answer","Share"],d.target.options.map(o=>[o.label,percent(r.shares[o.code])]),el("repeats"));if(r.evidence_note)el("repeats").append(node("p",r.evidence_note));el("repeats").append(node("p",r.reasoning||""));}

}else{
  const f=d.fear;el("repeat-details").hidden=true;
  el("result").append(node("p","Sensitivity: "+f.sensitivity));
  if(f.baseline){const label=f.baseline.kind==="observed"?"Observed":"Predicted baseline";el("result").append(node("p",label+" · "+f.baseline.source+" · "+f.baseline.denominator,"note"));
    stacked([{label:label,shares:f.baseline.shares},{label:"Model judgment without fear",shares:f.central.shares,hatched:true}],el("result"));
    const head=["Answer",label,"Without fear: model judgment","Change, pp",...f.alternatives.map(a=>a.label)];
    const rows=d.target.options.map(o=>[o.label,percent(f.baseline.shares[o.code]),percent(f.central.shares[o.code]),(f.changes_pp[o.code]>0?"+":"")+fmt(f.changes_pp[o.code]),...f.alternatives.map(a=>percent(a.shares[o.code]))]);
    makeTable(head.slice(0,4),rows.map(row=>row.slice(0,4)),el("result"));copyRows=[head,...rows];
    const scenarios=node("div",undefined,"scenarios");for(const a of f.alternatives){const panel=node("section",undefined,"scenario");panel.append(node("h2",a.label));makeTable(["Answer","Model scenario"],d.target.options.map(o=>[o.label,percent(a.shares[o.code])]),panel);scenarios.append(panel);}el("result").append(scenarios);
    el("result").append(node("p",f.uncertainty,"notice"));if(f.baseline.rounding_residual)el("result").append(node("p","Source rounding residual retained: "+fmt(f.baseline.rounding_residual)+" pp","note"));
    explanation+="\n\n"+f.central.rationale;for(const a of f.alternatives)explanation+="\n\n"+a.label+": "+a.rationale;
    explanation+="\n\nZero change: "+f.zero_considered+"\nOpposite direction: "+f.opposite_considered;
    if(f.central.transfers.length)makeTable(["Recorded category","Counterfactual category","Transfer, pp"],f.central.transfers.map(t=>[d.target.options.find(o=>o.code===t.from).label,d.target.options.find(o=>o.code===t.to).label,fmt(t.pp)]),el("explanation"));
  }else message("Qualitative assessment only. No baseline distribution was supplied; no numerical correction was invented.");
  for(const suggestion of f.design_suggestions||[])el("result").append(node("p",suggestion));
  explanation+="\n\n"+(f.mechanism||"");
}
for(const paragraph of explanation.split(/\n\n/).filter(Boolean))el("explanation").append(node("p",paragraph));
for(const source of d.sources||[]){const item=node("div",undefined,"source");item.append(node("strong",source.title||source.id||"Source"),node("p",[source.id,source.date,source.page!==undefined?"page "+source.page:null].filter(Boolean).join(" · "),"note"));if(source.note)item.append(node("p",source.note));try{const url=new URL(source.url);if(["https:","http:"].includes(url.protocol)){const a=node("a","Open source");a.href=url.href;a.target="_blank";a.rel="noopener noreferrer";item.append(a);}}catch{}el("sources").append(item);}
if(!(d.sources||[]).length)el("sources").append(node("p","No source records supplied."));
el("digest").textContent=d.digest||"No frozen digest in this mode. See the used-source ledger above.";
for(const [i,c] of (d.comparisons||[]).entries())if(c.kind==="prediction"){const id="comparison-"+i,panel=node("section",undefined,"tab-panel");panel.id=id;panel.hidden=true;panel.setAttribute("role","tabpanel");el("views").parentNode.insertBefore(panel,el("views").nextSibling);addView(c.label,id);panel.append(node("p",[c.result.model.name,c.result.mode,c.result.target.date,c.comparability_note].filter(Boolean).join(" · "),"note"));const grid=node("div",undefined,"method-grid"),evidence=node("div"),notes=node("div");evidence.append(node("h2","Corpus evidence"));evidenceCards(c.result.used_evidence||[],evidence);predictionNotes(c.result,notes);grid.append(evidence,notes);panel.append(grid);if(c.result.digest){const detail=node("details");detail.append(node("summary","Complete digest received by the model"),node("pre",c.result.digest));panel.append(detail);}}
if(d.groups?.length){addView("By population group","group-panel");makeTable(["Group","Model",...d.target.options.map(o=>o.label)],d.groups.map(g=>[g.label,g.result.model.name,...d.target.options.map(o=>g.result.shares?percent(g.result.shares[o.code]):g.result.status)]),el("group-results"));for(const g of d.groups){const details=node("details");details.append(node("summary",g.label+" · "+g.result.target.population));predictionNotes(g.result,details);evidenceCards(g.result.used_evidence||[],details);el("group-results").append(details);}}
const parameters={...d};for(const key of ["digest","sources","runs","fear","shares","spread","summary","reasoning","used_evidence","comparisons","groups"])delete parameters[key];el("parameters").textContent=JSON.stringify(parameters,null,2);
el("copy").disabled=!copyRows.length;
el("copy").addEventListener("click",async()=>{const text=copyRows.map(row=>row.map(v=>String(v).replace(/[\t\r\n]+/g," ")).join("\t")).join("\n");try{if(!navigator.clipboard)throw Error("clipboard unavailable");await navigator.clipboard.writeText(text);el("copy-status").textContent="Table copied.";}catch{const box=node("textarea",text);box.setAttribute("aria-label","Table for copying");el("copy-status").replaceChildren(node("span","Select and copy the table:"),box);box.focus();box.select();}});
el("download").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"})),a=node("a");a.href=url;a.download="synthbel-"+d.command+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script>
</html>
